<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Alert Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .notification {
            animation: slideIn 0.5s ease-in-out;
        }
        @keyframes slideIn {
            0% { transform: translateX(100%); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-2xl font-bold text-blue-600">JobAlert</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="notificationBtn" class="relative p-2 text-gray-600 hover:text-blue-600">
                        <i class="bi bi-bell text-xl"></i>
                        <span id="notificationCount" class="absolute top-0 right-0 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span>
                    </button>
                    <button class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Sign In</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="space-y-6">
                <h2 class="text-3xl font-bold text-gray-900">Create Job Alert</h2>
                <form id="alertForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Job Title</label>
                        <input type="text" id="jobTitle" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Location</label>
                        <input type="text" id="location" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Industry</label>
                        <select id="industry" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" required>
                            <option value="">Select Industry</option>
                            <option value="tech">Technology</option>
                            <option value="healthcare">Healthcare</option>
                            <option value="finance">Finance</option>
                            <option value="education">Education</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Alert Frequency</label>
                        <select id="frequency" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" required>
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                            <option value="monthly">Monthly</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700">Create Alert</button>
                </form>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-sm">
                <h3 class="text-xl font-semibold mb-4">Your Active Alerts</h3>
                <div id="alertsList" class="space-y-4">
                    <!-- Alerts will be added here dynamically -->
                </div>
            </div>
        </div>
    </main>

    <div id="notificationPanel" class="fixed top-4 right-4 z-50 hidden">
        <!-- Notifications will be added here dynamically -->
    </div>

    <script>
        let alerts = [];
        let notifications = [];

        document.getElementById('alertForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const alert = {
                id: Date.now(),
                jobTitle: document.getElementById('jobTitle').value,
                location: document.getElementById('location').value,
                industry: document.getElementById('industry').value,
                frequency: document.getElementById('frequency').value
            };

            alerts.push(alert);
            updateAlertsList();
            showNotification('Alert created successfully!');
            this.reset();
        });

        function updateAlertsList() {
            const alertsList = document.getElementById('alertsList');
            alertsList.innerHTML = alerts.map(alert => `
                <div class="bg-gray-50 p-4 rounded-lg">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-semibold">${alert.jobTitle}</h4>
                            <p class="text-sm text-gray-600">${alert.location}</p>
                            <p class="text-sm text-gray-600">${alert.industry} | ${alert.frequency}</p>
                        </div>
                        <button onclick="deleteAlert(${alert.id})" class="text-red-500 hover:text-red-700">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function deleteAlert(id) {
            alerts = alerts.filter(alert => alert.id !== id);
            updateAlertsList();
            showNotification('Alert deleted successfully!');
        }

        function showNotification(message) {
            const notification = {
                id: Date.now(),
                message: message
            };
            notifications.push(notification);
            updateNotificationCount();
            
            const notificationElement = document.createElement('div');
            notificationElement.className = 'notification bg-white shadow-lg rounded-lg p-4 mb-4';
            notificationElement.innerHTML = `
                <p class="text-gray-800">${message}</p>
            `;
            
            document.getElementById('notificationPanel').appendChild(notificationElement);
            document.getElementById('notificationPanel').classList.remove('hidden');

            setTimeout(() => {
                notificationElement.remove();
                notifications = notifications.filter(n => n.id !== notification.id);
                updateNotificationCount();
                if (notifications.length === 0) {
                    document.getElementById('notificationPanel').classList.add('hidden');
                }
            }, 3000);
        }

        function updateNotificationCount() {
            document.getElementById('notificationCount').textContent = notifications.length;
        }

        document.getElementById('notificationBtn').addEventListener('click', function() {
            const panel = document.getElementById('notificationPanel');
            panel.classList.toggle('hidden');
        });
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
